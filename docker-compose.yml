# Rask lokal PostgreSQL for utvikling.
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: skyggeby-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skyggeby
    ports:
      - '5432:5432'
    volumes:
      - skyggeby_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d skyggeby']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skyggeby_pgdata:
