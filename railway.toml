# Railway-konfigurasjon for Skyggeby staging.
#
# Én tjeneste kjører hele spillet: Express serverer både /api og den bygde
# React-klienten fra samme origin. Det gir ingen CORS, en førsteparts
# øktcookie og færrest mulige bevegelige deler. PostgreSQL er en egen
# Railway-tjeneste og deler DATABASE_URL med denne.
#
# Ingen hemmeligheter i denne filen - alt av verdier settes som variabler i
# Railway.

[build]
builder = "NIXPACKS"
# `--include=dev` er ikke valgfritt: TypeScript, Vite og Prisma CLI ligger i
# devDependencies, og med NODE_ENV=production ville npm hoppet over dem og
# byggingen ville feilet.
buildCommand = "npm ci --include=dev && npm run build:deploy"

[deploy]
# Migrasjoner kjøres før serveren starter, med `migrate deploy` - aldri
# `migrate dev` og aldri `migrate reset`. Kommandoen er idempotent: allerede
# anvendte migrasjoner hoppes over.
startCommand = "npm run start"

healthcheckPath = "/api/health"
healthcheckTimeout = 30

# Restart automatisk hvis prosessen faller, men ikke i evig løkke på en
# oppstart som alltid feiler.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Én instans. Rate limiteren teller i minnet, så horisontal skalering ville
# gitt hver instans sin egen kvote - se README før dette økes.
numReplicas = 1
